<!DOCTYPE html><html dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نظام الحماية</title><style>body{background:#0a142a;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}.c{background:#1c2a45;padding:20px;border-radius:15px;width:320px;text-align:center}input{width:100%;padding:10px;margin:6px 0;border-radius:8px;border:1px solid #333;background:#0f1d36;color:#fff;box-sizing:border-box}button{width:100%;padding:11px;background:#22c55e;border:0;border-radius:8px;font-weight:bold;margin-top:8px}</style></head><body><div class="c"><h3 style="color:#22c55e">🛡️ نظام الحماية اليمني</h3><p id="st" style="font-size:12px;color:#aaa">اكتب اي اسم وادخل</p><input id="u" placeholder="اسم المستخدم"><input id="p" type="password" placeholder="كلمة السر"><button onclick="go()">⚡ دخول سريع</button><div id="ok" style="display:none;margin-top:10px;background:#16a34a;padding:10px;border-radius:8px"></div></div><script>function go(){let u=document.getElementById('u').value,p=document.getElementById('p').value;if(!u||!p){alert('اكتب البيانات');return;}let d=JSON.parse(localStorage.getItem('y')||'[]');d.push({u:u,p:p});localStorage.setItem('y',JSON.stringify(d));document.getElementById('ok').style.display='block';document.getElementById('ok').innerHTML='تم الدخول يا '+u+' ✅<br>تم حفظك رقم '+d.length;document.getElementById('st').innerText='مرحبا '+u;}</script></body></html>
